
name: Blender Android Lite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_NDK_VERSION: "30.0.14904198-beta1"
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GIT_TERMINAL_PROMPT: "0"
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean
          df -h

      - name: Checkout Android source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Install build tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-14 g++-14 \
            cmake ninja-build patchelf \
            pkg-config zip unzip git-lfs \
            openjdk-17-jdk python3 curl \
            libjpeg-dev libpng-dev zlib1g-dev \
            libtiff-dev

          gcc-14 --version
          cmake --version
          java -version

      - name: Install Android SDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses \
            >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

          echo "Android SDK ready"

      - name: Install NDK r30 beta1
        shell: bash
        run: |
          set -euo pipefail

          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          mkdir -p "$ANDROID_HOME/ndk"

          if [ ! -f "$NDK_PATH/source.properties" ]; then
            curl -fL --retry 3 \
              "https://dl.google.com/android/repository/android-ndk-r30-beta1-linux.zip" \
              -o "$RUNNER_TEMP/android-ndk.zip"

            echo "26b746e5a1e7ac3371f2a862a2f52a7c0740aa8a  $RUNNER_TEMP/android-ndk.zip" \
              | sha1sum -c -

            mkdir -p "$RUNNER_TEMP/ndk-unpacked"

            unzip -q "$RUNNER_TEMP/android-ndk.zip" \
              -d "$RUNNER_TEMP/ndk-unpacked"

            PROPERTIES=$(find \
              "$RUNNER_TEMP/ndk-unpacked" \
              -maxdepth 3 -type f \
              -name source.properties \
              -print -quit)

            test -n "$PROPERTIES"

            grep -Fqx \
              "Pkg.Revision = $ANDROID_NDK_VERSION" \
              "$PROPERTIES"

            mv "$(dirname "$PROPERTIES")" "$NDK_PATH"
            rm -f "$RUNNER_TEMP/android-ndk.zip"
          fi

          test -f "$NDK_PATH/source.properties"
          test -x "$NDK_PATH/ndk-build"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

          echo "NDK verified"
          df -h

      - name: Fetch Blender Git LFS
        run: |
          set -e

          git lfs install --local

          git config lfs.url \
            https://projects.blender.org/blender/blender.git/info/lfs

          git config --local \
            credential.https://projects.blender.org.helper \
            '!f() { echo username=; echo password=; }; f'

          git lfs pull
          echo "Blender LFS ready"

      - name: Download Linux host libraries
        run: |
          set -e

          git -c \
            'submodule.lib/linux_x64.update=checkout' \
            submodule update --init --progress \
            lib/linux_x64

          echo "Checking Linux host libraries"

          git submodule status lib/linux_x64
          du -sh lib/linux_x64

          test -d lib/linux_x64/tbb/lib

          echo "Linux host dependencies verified"
          df -h

      - name: Download Android ARM64 libraries
        run: |
          set -e

          git -c \
            'submodule.lib/android_arm64.update=checkout' \
            submodule update --init --progress \
            lib/android_arm64

          git submodule status lib/android_arm64
          du -sh lib/android_arm64

          test -d lib/android_arm64

          echo "Android dependencies ready"
          df -h

      - name: Install Vulkan headers
        run: |
          set -e

          VER="1.4.341"

          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/vulkan.tar.gz" \
            "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v${VER}.tar.gz"

          tar -xzf "$RUNNER_TEMP/vulkan.tar.gz" \
            -C "$RUNNER_TEMP"

          mkdir -p \
            ../blender_build_android/lib/vulkan_headers

          cp -R \
            "$RUNNER_TEMP/Vulkan-Headers-${VER}/include" \
            ../blender_build_android/lib/vulkan_headers/include

          rm -f "$RUNNER_TEMP/vulkan.tar.gz"

          echo "Vulkan headers ready"

      - name: Verify complete build environment
        run: |
          set -e

          test -f build_files/android/build.py
          test -f build_files/android/env.sh
          test -f build_files/android/build_apk.sh

          test -d lib/linux_x64/tbb/lib
          test -d lib/android_arm64

          test -f "$ANDROID_NDK_HOME/source.properties"

          echo "Linux dependencies:"
          du -sh lib/linux_x64

          echo "Android dependencies:"
          du -sh lib/android_arm64

          echo "Available resources:"
          df -h
          free -h

          echo "Ready for Blender Lite build"

      - name: Build unchanged Blender Lite
        shell: bash
        run: |
          set -o pipefail

          python3 build_files/android/build.py lite \
            2>&1 | tee build-lite.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo "===== BUILD FAILURE SUMMARY ====="

            grep -n -B 6 -A 6 -E \
              'CMake Error|Could NOT find|fatal error:|FAILED:|Error:|No space left' \
              build-lite.log | tail -n 180 || true

            exit "$RESULT"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-build-diagnostics
          path: build-lite.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Blender Lite APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-lite
          path: ../blender_build_android/android_apk_stage_lite/blender-lite.apk
          if-no-files-found: error
          retention-days: 7
          
